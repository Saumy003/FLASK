<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP APP | Registration form</title>
</head>
<body style="background-color:lightcoral;">
    <h1>NPL App</h1>

    <h3>Register yourself NOW !! Hurry Up </h3>

    <form action="/perform_registration" method="post">
        <label for="">Name</label>
        <input type="text" name="user_ka_name"><br><br>
        <label for="">Email</label>
        <input type="email" name="user_ka_email"><br><br>
        <label for="">Password</label>
        <input type="password" name="user_ka_password"><br><br>
        <input type="submit" value="Register">
    </form>

    <p>Already a member?<a href="/">Go to login page</a></p>
    
</body>
</html>
