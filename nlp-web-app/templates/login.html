<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP APP | Login Page</title>
</head>
<body style="background-color: lemonchiffon;">
    <h1>NPL App</h1>

    <h3>Login here</h3>


    {% if message %}
       <p style="color: green;">{{message}}</p>
    {% endif %}

    <form action="/perform_login", method="post">
        <label for="">Name</label>
        <input type="text" name="user_ka_name"><br><br>
        <label for="">Email</label>
        <input type="email" name="user_ka_email"><br><br>
        <label for="">Password</label>
        <input type="password" name="user_ka_password"><br><br>
        <input type="submit" value="Login">
    </form>

    <p>Not a member? <a href="/register">Register Here</a></p>
</body>
</html>
